<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="LearnHub — A modern learning platform for Data Science, Cybersecurity, Machine Learning, and Full-Stack Development.">
  <title>LearnHub — Learn Tech Skills</title>

  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Highlight.js for syntax highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <!-- Additional language support for Highlight.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/bash.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/sql.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/css.min.js"></script>

  <!-- marked.js Markdown parser -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>

  <!-- Favicon (inline SVG emoji) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
</head>
<body>

  <!-- The entire app renders here -->
  <div id="app">
    <div class="loading-spinner" style="height:100vh">
      <div class="spinner"></div>
      <p>Loading LearnHub…</p>
    </div>
  </div>

  <!-- Configure marked.js options -->
  <script>
    marked.setOptions({
      breaks: true,       // Convert line breaks to <br>
      gfm: true,          // GitHub Flavored Markdown (tables, etc.)
      headerIds: true,
    });
  </script>

  <!-- Main application (ES modules) -->
  <script type="module" src="js/app.js"></script>

</body>
</html>
